.hero{position:relative;overflow:hidden;isolation:isolate;margin:-18px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 4px calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(30px + env(safe-area-inset-top,0px)) 22px 26px;background:radial-gradient(130% 85% at 50% 0%,#6E3BBB 0%,#3A1468 52%,#22083D 100%);color:#fff;text-align:center;border-radius:0 0 26px 26px}

@keyframes shine{0%{left:-60%}55%,100%{left:135%}}
.btn-pri:not(:disabled):hover{box-shadow:0 6px 18px rgba(91,42,158,.28)}
.card,.contact,.who,.rv,.dv{transition:box-shadow .25s,border-color .25s,transform .25s}
.contact:hover,.card:hover{box-shadow:var(--shadow)}
.vstep li.cur .dot{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,168,0,.55)}100%{box-shadow:0 0 0 10px rgba(226,168,0,0)}}
.enter .vstep li.done .dot{animation:dotIn .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes dotIn{from{transform:scale(.5)}}
/* ภาพแนะนำการส่งรูปถ่าย */
.guide{gap:0;padding:14px 14px 16px}
.guide .card-h{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.guide .card-h em{font:600 13px var(--f-head);font-style:normal;color:var(--amber-ink);background:var(--amber-soft);border-radius:999px;padding:1px 10px}
.g-step{display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:10px;align-items:start}
.g-n{width:30px;height:30px;border-radius:50%;background:var(--navy-2);color:#fff;display:grid;place-items:center;font:700 15px var(--f-label);box-shadow:0 0 0 4px var(--teal-soft)}
.g-t{display:grid;gap:1px;padding-top:2px;min-width:0}
.g-t b{font:600 15px/1.45 var(--f-head);color:var(--ink)}
.g-t span{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.g-t span b{font-size:inherit;font-family:var(--f-head)}
.g-row{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:8px;align-items:center}
.g-art{display:block;width:100%;height:auto;overflow:visible}
.g-slip{grid-column:1/-1;margin:10px -4px 0;padding:12px 6px 2px;border-radius:12px;background:linear-gradient(180deg,var(--teal-soft),rgba(0,0,0,0) 85%)}
.g-cap{font-size:12.5px;color:var(--ink-3);text-align:center;margin:2px 0 8px}
.g-cap b{color:#1d44b8;font-weight:600}
@media (prefers-color-scheme: dark){.g-cap b{color:#9db4ff}}
.g-flow{width:30px;height:34px;display:grid;place-items:center}
.g-flow svg{width:14px;height:30px;overflow:visible}
.g-flow path{fill:none;stroke:var(--teal);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.g-flow .fl{stroke-dasharray:3 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.g-legend{grid-column:1/-1;list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px;line-height:1.55;color:var(--ink-2)}
.g-legend li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;align-items:start}
.g-legend i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);font:700 12.5px/22px var(--f-label);text-align:center;margin-top:1px}
.g-legend b{color:var(--ink);font-family:var(--f-head)}
.g-legend .num{font-family:var(--f-label);letter-spacing:.06em}
/* กระดาษจำลอง (สีคงที่ เหมือนกระดาษจริง) */
.sl-t{font-family:var(--f-head);fill:#161616}
.sl-s{font-family:var(--f-body);fill:#3a3a3a}
.sl-dl{stroke:#555;stroke-width:1.3;stroke-dasharray:1.5 3.5;stroke-linecap:round}
.hw{font-family:"Mali","IBM Plex Sans Thai",cursive;font-weight:500;fill:#1d44b8}
.hw-sig{fill:none;stroke:#1d44b8;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sl-mk circle{fill:#F5B700;stroke:#fff;stroke-width:3.5}
.sl-mk text{font:700 17px "Chakra Petch",sans-serif;fill:#2A1300}
.sl-pill{filter:drop-shadow(0 3px 5px rgba(40,10,80,.28))}
.sl-arw{fill:none;stroke:#F5B700;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.sl-arw2{fill:none;stroke:#3A1468;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.sl-arw-g{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
.play .hw,.play .hw-g{animation:hwIn .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:50% 80%}
@keyframes hwIn{from{opacity:0;transform:translateY(5px) scale(.6)}}
.play .hw-sig{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease-out forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.play .sl-mk,.play .sl-pill-g{animation:mkIn .45s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
@keyframes mkIn{from{opacity:0;transform:scale(.3)}}
.play .sl-photo{animation:photoIn .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d,0s)}
@keyframes photoIn{from{opacity:0;transform:translate(70px,-90px) rotate(18deg)}}
/* ลิ้นชัก */
.dw-cab{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.dw-front{fill:var(--surface);stroke:var(--teal);stroke-width:2}
.dw-slot{fill:var(--ink);opacity:.55}
.dw-plate{fill:var(--navy-2)}
.dw-plate-t{font:600 11.5px var(--f-head);fill:#fff}
.dw-handle{fill:var(--teal)}
.dw-num{fill:#F5B700;stroke:var(--surface);stroke-width:2.5}
.dw-num-t{font:700 14px "Chakra Petch",sans-serif;fill:#2A1300}
.dw-paper{fill:#fff;stroke:#b9b0c9;stroke-width:1.2}
.dw-pl{stroke:#c9c2d6;stroke-width:2;stroke-linecap:round}
.dw-arw{fill:none;stroke:#F5B700;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.dw-in{animation:slipIn 3.4s ease-in-out infinite}
@keyframes slipIn{0%{transform:translateY(-16px);opacity:0}14%{transform:translateY(-16px);opacity:1}62%,100%{transform:translateY(46px);opacity:1}}
.dw-out{animation:slipOut 3.4s ease-in-out infinite}
@keyframes slipOut{0%{transform:translateY(46px);opacity:1}48%,82%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
.dw-bob{animation:nudge 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.guide *{animation:none!important}}
@media (prefers-reduced-motion: reduce){.enter>*,.doc.on,.btn-gold::after,.bigno b,.vstep li .dot,.mdl,.mdl-card,.mdl-img img,.sem.pop,.steps.enter .steps-bar i{animation:none!important}}

  }
  var A = {};
  A.home = function () { go('home'); };
  A.retry = function () { init(); };
  A.start = function () { P.mode = 'new'; if (P.student && P.token) startDraft(); else go('verify'); };
  A.track = function () { P.mode = 'track'; if (P.student && P.token) refresh(function () { P.screen = 'list'; }); else go('verify'); };
  A.list = function () { if (P.student) go('list'); else A.track(); };
  A['new'] = function () { P.mode = 'new'; startDraft(); };
  A['ed-ok'] = function (a) {
    var k = a.dataset.k, s = P.student, e = P.draft.edits[k];
    e.open = false; e.reason = '';
    if (k === 'name') { e.pre = s.prefix; e.fn = s.fname; e.ln = s.lname; } else e.val = k === 'dob' ? PP.fLong(s.dob) : (k === 'fa' ? s.father : s.mother);
    render();
  };
  A['ed-open'] = function (a) { P.draft.edits[a.dataset.k].open = true; render(); var el = document.getElementById(a.dataset.k === 'name' ? 'ed-fn' : 'ed-' + a.dataset.k); if (el) el.focus(); };
  A.stp = function (a) { var d = P.draft, k = a.dataset.k; d[k] = Math.max(0, Math.min(2, d[k] + Number(a.dataset.d))); render(); };
  A.go = function (a) { go(a.dataset.to); };
  A['pp6-open'] = function () { P.draft.pp6Open = true; render(); };
  A.sem = function (a) {
    var d = P.draft, v = a.dataset.v, i = d.pp6Sems.indexOf(v);
    if (i > -1) d.pp6Sems.splice(i, 1);
    else { if (d.pp6Sems.length >= 12) return PP.toast('ขอ ปพ.6 ได้ไม่เกิน 12 ภาคเรียนต่อครั้ง'); d.pp6Sems.push(v); }
    d.pp6Sems.sort(function (x, y) { return PP.semKey(x) - PP.semKey(y); });
    var on = i < 0, n = d.pp6Sems.length, cnt = $('cnt6'), dc = $('doc-pp6');
    a.classList.toggle('on', on); a.setAttribute('aria-pressed', String(on));
    a.classList.remove('pop'); void a.offsetWidth; if (on) a.classList.add('pop');
    if (cnt) { cnt.textContent = n + ' แผ่น'; cnt.classList.toggle('zero', !n); }
    if (dc) dc.classList.toggle('on', n > 0);
  };
  A.sample = function (a) { P.sample = { doc: a.dataset.doc || 'pp1', page: 0, anim: true }; renderModal(); var x = document.querySelector('.mdl-x'); if (x) x.focus(); };
  A['sample-close'] = function () { P.sample = null; renderModal(); };
  A['sample-tab'] = function (a) { P.sample.doc = a.dataset.doc; P.sample.page = 0; renderModal(); };
  A['sample-page'] = function (a) { P.sample.page = Number(a.dataset.p) || 0; renderModal(); };
  A['data-next'] = function () {
    var e = P.draft.edits, s = P.student, m = '';
    ['name', 'dob', 'fa', 'mo'].some(function (k) {
      if (!e[k].open) return false;
      var lab = { name: 'ชื่อ-สกุล', dob: 'วันเกิด', fa: 'ชื่อบิดา', mo: 'ชื่อมารดา' }[k];
      if (!e[k].reason) { m = 'เลือกเหตุผลที่ขอแก้ไข' + lab; return true; }
      if (k === 'name') {
        if (!e.name.fn.trim() || !e.name.ln.trim()) { m = 'กรอกชื่อและชื่อสกุลให้ครบ'; return true; }
        if (e.name.pre === s.prefix && e.name.fn.trim() === s.fname && e.name.ln.trim() === s.lname) { m = 'ชื่อ-สกุลที่กรอกยังเหมือนในทะเบียน ถ้าถูกต้องแล้วให้กด "ถูกต้อง"'; return true; }
        return false;
      }
      if (e[k].reason === 'ไม่มีข้อมูลหรือไม่ประสงค์ระบุ') { e[k].val = ''; return false; }
      if (!e[k].val.trim()) { m = 'กรอก' + lab + 'ที่ถูกต้อง'; return true; }
      var orig = k === 'dob' ? PP.fLong(s.dob) : (k === 'fa' ? s.father : s.mother);
      if (e[k].val.trim() === orig) { m = lab + 'ที่กรอกยังเหมือนในทะเบียน ถ้าถูกต้องแล้วให้กด "ถูกต้อง"'; return true; }
      return false;
    });
    P.draft.err = m; if (m) return render(); go('docs');
  };
  A['docs-next'] = function () {
    var d = P.draft, m = '', tel = d.phone.replace(/\D/g, '');
    if (d.pp1 + d.pp7 + d.pp6Sems.length === 0) m = 'เลือกเอกสารอย่างน้อย 1 ชนิด';
    else if (d.purpose === 'อื่น ๆ' && !d.other.trim()) m = 'ระบุวัตถุประสงค์';
    else if (!/^0\d{9}$/.test(tel)) m = 'เบอร์โทรศัพท์ต้องเป็นตัวเลข 10 หลัก ขึ้นต้นด้วย 0';
    d.err = m; if (m) return render(); go('review');
  };
  A.submit = function () {
    var d = P.draft;
    if (!d.agree) { d.err = 'ติ๊กรับรองความถูกต้องของข้อมูลก่อนยื่นคำร้อง'; return render(); }
    if (P.busy) return;
    P.busy = true; d.err = ''; render();
    var req = { pp1: d.pp1, scope: d.scope, lang: d.lang, pp7: d.pp7, pp6Sems: d.pp6Sems.slice(), purpose: d.purpose, other: d.other, needBy: d.needBy, phone: d.phone.replace(/\D/g, ''), changes: collectChanges() };
    PP.api('submit', { token: P.token, req: req }).then(function (r) {
      P.requests.unshift(r.request); P.lastNo = r.request.no; P.draft = null; P.busy = false; go('done');
    }).catch(function (e) { P.busy = false; if (!onAuthErr(e)) { d.err = e.message; render(); } });
  };
  A.open = function (a) { P.viewNo = a.dataset.no; P.rateFor = null; go('detail'); refresh(); };
  A.refresh = function () { refresh(); };
  A['refresh-detail'] = function () { refresh(); };
  A['cancel-ask'] = function (a) { P.confirmCancel = a.dataset.no; render(); };
  A['cancel-no'] = function () { P.confirmCancel = null; render(); };
  A['cancel-yes'] = function (a) {
    P.busy = true; render();
    PP.api('cancel', { token: P.token, no: a.dataset.no }).then(function () { P.busy = false; P.confirmCancel = null; PP.toast('ยกเลิกคำร้องแล้ว'); refresh(); })
      .catch(function (e) { P.busy = false; if (!onAuthErr(e)) { PP.toast(e.message); render(); } });
  };
  A.got = function (a) { P.rateFor = a.dataset.no; render(); };
  A.rate = function (a) {
    if (P.busy) return;
    P.busy = true; render();
    PP.api('received', { token: P.token, no: a.dataset.no, rating: Number(a.dataset.v) || 0 }).then(function () { P.busy = false; P.rateFor = null; PP.toast('ปิดคำร้องแล้ว ขอบคุณครับ/ค่ะ'); refresh(); })
      .catch(function (e) { P.busy = false; if (!onAuthErr(e)) { PP.toast(e.message); render(); } });
  };
  A.logout = function () {
    var t = P.token; PP.store.del(TOKEN_KEY); P.token = null; P.student = null; P.requests = []; go('home');
    if (t) PP.api('logout', { token: t }).catch(function () { });
  };

  function doVerify() {
    var sid = P.sid.replace(/\D/g, ''), nid = P.nid.replace(/\D/g, '');
    P.err = '';
    if (!/^\d{5}$/.test(sid)) P.err = 'รหัสนักเรียนต้องเป็นตัวเลข 5 หลัก';
    else if (!/^\d{13}$/.test(nid)) P.err = 'เลขประจำตัวประชาชนต้องเป็นตัวเลข 13 หลัก';
    else if (!PP.nidOk(nid)) P.err = 'เลขประจำตัวประชาชนไม่ถูกต้อง ลองตรวจทีละหลักอีกครั้ง';
    if (P.err) return render();
    P.busy = true; render();
    PP.api('verify', { sid: sid, nid: nid, remember: P.remember }).then(function (r) {
      saveToken(r.token); setMe(r); P.busy = false; P.nid = '';
      if (P.mode === 'new') startDraft(); else go('list');
    }).catch(function (e) { P.busy = false; P.err = e.message; render(); });
  }

  document.addEventListener('click', function (e) {
    if (e.target.classList && e.target.classList.contains('mdl')) { P.sample = null; renderModal(); return; }
    var a = e.target.closest('[data-act]'); if (!a) return;
    var fn = A[a.dataset.act]; if (fn) { e.preventDefault(); fn(a, e); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && P.sample) { P.sample = null; renderModal(); } });
  document.addEventListener('submit', function (e) { if (e.target.id === 'f-verify') { e.preventDefault(); doVerify(); } });
  document.addEventListener('change', function (e) {
    var t = e.target, k = t.dataset && t.dataset.change; if (!k) return;
    if (k === 'remember') P.remember = t.checked;
    else if (k === 'agree') P.draft.agree = t.checked;
    else if (k === 'scope') P.draft.scope = t.value;
    else if (k === 'lang') P.draft.lang = t.value;
    else if (k === 'purpose') { P.draft.purpose = t.value; render(); }
    else if (k === 'needBy') { P.draft.needBy = t.value; render(); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t.dataset) return;
    if (t.dataset.bind) P[t.dataset.bind] = t.value;
    if (t.dataset.dbind && P.draft) P.draft[t.dataset.dbind] = t.value;
    if (t.dataset.ebind && P.draft) { var p = t.dataset.ebind.split('.'); P.draft.edits[p[0]][p[1]] = t.value; }
  });

  function init() {
    P.screen = 'loading'; render();
    var t = PP.store.get(TOKEN_KEY);
    var p = t ? PP.api('me', { token: t }).then(function (r) { P.token = t; setMe(r); }).catch(function (e) { if (e.code === 'AUTH') { PP.store.del(TOKEN_KEY); return PP.api('config').then(function (r) { setCfg(r.config); }); } throw e; })
      : PP.api('config').then(function (r) { setCfg(r.config); });
    p.then(function () { go('home'); }).catch(function (e) { P.err = e.message; P.screen = 'error'; render(); });
  }
  init();
})();
</script>
</body>
</html>
