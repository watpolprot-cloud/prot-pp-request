<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>หลังบ้าน · คำร้อง ปพ. งานทะเบียน</title>
<meta name="theme-color" content="#3A1468">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/emblem-bw.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
body{font-size:15px}
.wrapc{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 90% at 50% 0%,#5B2A9E 0%,#2A0E4F 70%)}
.login-card{width:min(420px,100%);background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(10,0,30,.35)}
.login-top{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--navy-ink);padding:22px 24px 18px;border-bottom:4px solid var(--gold);display:grid;justify-items:center;text-align:center;gap:2px}
.login-top img{height:78px;width:auto;margin-bottom:8px}
.login-top b{font:600 16px/1.4 var(--f-head)}
.login-top span{font:600 10.5px/1.6 var(--f-label);letter-spacing:.24em;color:var(--gold-2)}
.login-top h1{font-size:20px;margin-top:8px}
.login-b{padding:20px 24px 24px;display:grid;gap:14px}
/* shell */
.atop{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:var(--navy-ink);display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:8px}
.abrand{display:flex;align-items:center;gap:11px;min-width:0}
.abrand img{height:42px;width:auto;flex:none}
.abrand div{display:grid;line-height:1.3;min-width:0}
.abrand b{font:600 16px var(--f-head)}
.abrand span{font:500 13px var(--f-head);color:var(--band-sub)}
.auser{display:flex;align-items:center;gap:12px;text-align:right}
.auser div{display:grid;line-height:1.3}
.auser b{font:600 14px var(--f-head)} .auser small{color:var(--band-sub);font-size:12px}
.auser .btn{background:rgba(255,255,255,.12);color:var(--navy-ink);border-color:rgba(255,255,255,.2)}
.stripe{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2) 50%,var(--gold))}
.anav{display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;position:sticky;top:0;z-index:15}
.anav button{border:0;background:none;padding:12px 13px;font:600 14.5px var(--f-head);color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
.anav button.on{color:var(--ink);border-bottom-color:var(--teal)}
.anav .cnt{font:700 12px/1 var(--f-label);background:var(--grey-soft);border-radius:999px;padding:3px 8px;color:var(--ink-2)}
.anav .sync{margin-left:auto;align-self:center;font-size:12.5px;color:var(--ink-3);padding-right:4px;white-space:nowrap}
.abody{padding-block:16px 60px;display:grid;gap:12px;max-width:1400px}
.filters{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.filters{grid-template-columns:repeat(4,minmax(0,1fr))}}
.flt{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 11px;text-align:left;cursor:pointer;display:grid;gap:2px;align-content:space-between}
.flt span{font:600 13px/1.35 var(--f-head);color:var(--ink-2)}
.flt b{font:700 24px/1.1 var(--f-label);font-variant-numeric:tabular-nums}
.flt.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);background:var(--teal-soft)}
.flt.hot b{color:var(--red)}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tool .inp{max-width:360px}
.batch{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:8px 10px 8px 14px;min-height:48px;flex-wrap:wrap}
.batch b{font:600 14px var(--f-head)}
.batch-b{display:flex;gap:6px;flex-wrap:wrap}
.batch .btn-sec{background:rgba(255,255,255,.1);color:var(--navy-ink);border-color:rgba(255,255,255,.25)}
.batch .btn-ghost{color:var(--band-sub)}
.batch-empty{background:var(--surface);color:var(--ink-3);border:1px dashed var(--line);font-size:14px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.qt{width:100%;border-collapse:collapse;font-size:14.5px;min-width:900px}
.qt th{font:600 12.5px/1.4 var(--f-head);color:var(--ink-3);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
.qt td{padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.5}
.qt td small{display:block;color:var(--ink-3);font-size:12.5px}
.qt td b{font:600 14.5px/1.5 var(--f-head)}
.qt tbody tr{cursor:pointer}
.qt tbody tr:hover{background:var(--surface-2)}
.qt tbody tr.is-open{background:var(--teal-soft)}
.qt tr:last-child td{border-bottom:0}
.qt .c-chk{width:38px;text-align:center}
.qt input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);cursor:pointer}
.qt .no{font:700 15px var(--f-label);letter-spacing:.03em}
.empty{padding:26px;text-align:center;color:var(--ink-3)}
/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-14px 0 36px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:30}
.dt-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dt-h>div{flex:1;display:grid;line-height:1.3}
.dt-ey{font:600 12px var(--f-head);color:var(--ink-3)}
.dt-no{font:700 22px var(--f-label);letter-spacing:.04em}
.dt-b{flex:1;overflow-y:auto;padding:12px 16px 30px;display:grid;gap:18px;align-content:start}
.dt-b h5{font:600 13px/1.4 var(--f-head);color:var(--ink-3);margin-bottom:6px}
.fd{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-2)}
.fd:last-child{border-bottom:0}
.fd-l{font-size:13px;color:var(--ink-3)}
.fd-v{font:600 15px/1.45 var(--f-head);min-width:0;overflow-wrap:anywhere}
.fd.chg{background:var(--amber-soft);border-radius:8px;padding:6px 8px;border-bottom:0;margin:3px 0}
.fd.chg .was{display:block;font:400 13px var(--f-body);color:var(--ink-2);text-decoration:line-through}
.fd.chg em{display:block;font:500 12.5px var(--f-body);font-style:normal;color:var(--amber-ink)}
.cp{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;font:600 12.5px var(--f-head);color:var(--teal-ink);cursor:pointer;white-space:nowrap}
.cp:hover{border-color:var(--teal)}
.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:5px 10px;font-size:14.5px}
.kv span{color:var(--ink-3);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.fixbox{display:grid;gap:8px;background:var(--red-soft);border-radius:10px;padding:10px 12px}
.confirm{display:grid;gap:8px;background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.confirm div{display:flex;gap:8px;flex-wrap:wrap}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.log li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px}
.log time{color:var(--ink-3);font-size:12.5px}
.log b{font:600 13px var(--f-head);color:var(--ink-2);margin-right:4px}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;max-width:820px}
.panel h3{font-size:17px}
.panel p.hint{font-size:13.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font:600 14.5px var(--f-head)}
.sw input{appearance:none;width:44px;height:25px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--surface);transition:left .2s}
.sw input:checked{background:var(--teal)}
.sw input:checked::after{left:22px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.stats span{font:600 13px var(--f-head);color:var(--ink-3)}
.stats b{font:700 28px/1.15 var(--f-label);font-variant-numeric:tabular-nums}
.stats small{font-size:12.5px;color:var(--ink-3)}
.mini{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.mini th,.mini td{padding:7px 12px;border-bottom:1px solid var(--line-2);text-align:left}
.mini th{font:600 12.5px var(--f-head);color:var(--ink-3)}
.mini .r{text-align:right;font-variant-numeric:tabular-nums}
.mini tr:last-child td{border-bottom:0}
.qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qrbox .qr{width:150px;background:#fff;padding:10px;border-radius:8px;border:1px solid var(--line)}
.qrbox .qr svg,.qrbox .qr img{width:100%;height:auto;display:block}
.urlbox{font:500 14px var(--f-label);word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.center{display:grid;place-items:center;gap:10px;padding:60px 0;color:var(--ink-2)}
.sems6{display:grid;gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.sems6>div{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.sems6>div>span{font:600 13px var(--f-head);color:var(--ink-3);min-width:96px}
.chk6{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk6 input{width:16px;height:16px;accent-color:var(--teal)}
</style>
<script src="config.js"></script>
<script src="assets/common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div id="app"><div class="center"><span class="spin"></span><span>กำลังโหลด</span></div></div>
<aside id="drawer" hidden aria-label="รายละเอียดคำร้อง"></aside>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="print-root"></div>
<script>
(function () {
  'use strict';
  var esc = PP.esc, TOKEN_KEY = 'pp_admin_token';
  var A = { token: null, me: null, cfg: null, settings: {}, fixReasons: [], students: 0, list: [], view: 'queue', filter: 'open', q: '', sel: {},
    open: null, fixOpen: false, fixIdx: 0, fixText: '', confirm: null, busy: false, lastSync: null, report: null, login: { step: 'login', err: '', setupToken: null, name: '' },
    man: null, setErr: '' };
  function $(id) { return document.getElementById(id); }
  function find(no) { for (var i = 0; i < A.list.length; i++) if (A.list[i].no === no) return A.list[i]; return null; }
  function lvOf(r) { return String(r.cls || '').split('/')[0]; }
  function roomOf(r) { return String(r.cls || '').split('/')[1] || ''; }
  function nPhotos(r) { return (r.pp1 || 0) + (r.pp7 || 0); }
  function hasChanges(r) { return r.changes && Object.keys(r.changes).length > 0; }
  function qrSvg(text, cell) {
    try { if (typeof qrcode !== 'function') return ''; var q = qrcode(0, 'M'); q.addData(unescape(encodeURIComponent(text))); q.make(); return q.createSvgTag({ cellSize: cell || 4, margin: 0, scalable: true }); } catch (e) { return ''; }
  }
  function apiAdmin(action, data) {
    return PP.api(action, Object.assign({ token: A.token }, data || {})).catch(function (e) {
      if (e.code === 'AUTH') { PP.store.del(TOKEN_KEY); A.token = null; renderLogin(); PP.toast('กรุณาเข้าสู่ระบบอีกครั้ง'); }
      throw e;
    });
  }

  /* ===================== Login ===================== */
  function renderLogin() {
    $('drawer').hidden = true;
    var L = A.login;
    var body = L.step === 'setup'
      ? '<p>สวัสดี ' + esc(L.name) + ' กรุณาตั้งรหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร) ระบบจะใช้รหัสนี้แทนรหัสผ่านชั่วคราว</p>' +
        '<form id="f-setup" style="display:grid;gap:14px"><div><label class="lbl" for="pw1">รหัสผ่านใหม่</label><input class="inp" id="pw1" type="password" autocomplete="new-password"></div>' +
        '<div><label class="lbl" for="pw2">ยืนยันรหัสผ่านใหม่</label><input class="inp" id="pw2" type="password" autocomplete="new-password"></div>' +
        (L.err ? '<div class="note n-alert"><span>' + esc(L.err) + '</span></div>' : '') +
        '<button class="btn btn-pri btn-blk" type="submit"' + (A.busy ? ' disabled' : '') + '>' + (A.busy ? '<span class="spin"></span> กำลังบันทึก' : 'บันทึกรหัสผ่านและเข้าสู่ระบบ') + '</button></form>'
      : '<form id="f-login" style="display:grid;gap:14px"><div><label class="lbl" for="un">ชื่อผู้ใช้</label><input class="inp" id="un" autocomplete="username" autocapitalize="off"></div>' +
        '<div><label class="lbl" for="pw">รหัสผ่าน</label><input class="inp" id="pw" type="password" autocomplete="current-password"></div>' +
        (L.err ? '<div class="note n-alert"><span>' + esc(L.err) + '</span></div>' : '') +
        '<button class="btn btn-pri btn-blk" type="submit"' + (A.busy ? ' disabled' : '') + '>' + (A.busy ? '<span class="spin"></span> กำลังเข้าสู่ระบบ' : 'เข้าสู่ระบบ') + '</button>' +
        '<p class="muted" style="font-size:13px">ลืมรหัสผ่านหรือเข้าใช้ครั้งแรก ติดต่อผู้ดูแลระบบเพื่อขอรหัสผ่านชั่วคราว</p></form>';
    $('app').innerHTML = '<div class="login"><div class="login-card"><div class="login-top"><img src="assets/emblem-gold.png" alt="ตราโรงเรียนพรตพิทยพยัต" width="64" height="78"><b>โรงเรียนพรตพิทยพยัต</b><span>PROT PITTAYAPAYAT SCHOOL</span><h1>หลังบ้านระบบคำร้อง ปพ.</h1></div><div class="login-b">' + body + '</div></div></div>';
    var f = $(L.step === 'setup' ? 'pw1' : 'un'); if (f) f.focus();
  }
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'f-login') {
      e.preventDefault(); if (A.busy) return;
      var u = $('un').value.trim(), p = $('pw').value;
      if (!u || !p) { A.login.err = 'กรอกชื่อผู้ใช้และรหัสผ่าน'; return renderLogin(); }
      A.busy = true; A.login.err = ''; renderLogin();
      PP.api('login', { username: u, password: p }).then(function (r) {
        A.busy = false;
        if (r.setup) { A.login = { step: 'setup', setupToken: r.setupToken, name: r.displayName, err: '' }; return renderLogin(); }
        afterLogin(r);
      }).catch(function (er) { A.busy = false; A.login.err = er.message; renderLogin(); });
    }
    if (e.target.id === 'f-setup') {
      e.preventDefault(); if (A.busy) return;
      var a = $('pw1').value, b = $('pw2').value;
      if (a.length < 8) { A.login.err = 'รหัสผ่านใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร'; return renderLogin(); }
      if (a !== b) { A.login.err = 'รหัสผ่านทั้งสองช่องไม่ตรงกัน'; return renderLogin(); }
      A.busy = true; A.login.err = ''; renderLogin();
      PP.api('setPassword', { setupToken: A.login.setupToken, newPassword: a }).then(function (r) { A.busy = false; afterLogin(r); })
        .catch(function (er) { A.busy = false; A.login.err = er.message; renderLogin(); });
    }
  });
  function afterLogin(r) {
    A.token = r.token; A.me = r.user; PP.store.set(TOKEN_KEY, r.token, true);
    A.login = { step: 'login', err: '' };
    load(true);
  }

  /* ===================== Data ===================== */
  function load(first) {
    if (first) $('app').innerHTML = '<div class="center"><span class="spin"></span><span>กำลังโหลดคำร้อง</span></div>';
    return apiAdmin('adminList').then(function (r) {
      A.list = r.requests; A.cfg = r.config; PP.cfg = r.config; PP.setHolidays(r.config.holidays); A.settings = r.settings; A.me = r.me;
      A.fixReasons = r.fixReasons || []; A.students = r.students; A.lastSync = new Date();
      if (first) { renderShell(); openFromHash(); } else { renderBody(); renderDrawer(); renderNav(); }
    }).catch(function (e) { if (e.code !== 'AUTH') { if (first) $('app').innerHTML = '<div class="center"><div class="note n-alert"><b>โหลดข้อมูลไม่ได้</b><span>' + esc(e.message) + '</span></div><button class="btn btn-pri" data-act="reload">ลองใหม่</button></div>'; else PP.toast(e.message); } });
  }
  function openFromHash() { var m = location.hash.match(/no=(\d{4})/); if (m && find(m[1])) { A.open = m[1]; renderDrawer(); renderBody(); } }

  /* ===================== Shell ===================== */
  var TABS = [['queue', 'คิวงาน'], ['manual', 'บันทึกคำร้องแทน'], ['report', 'รายงาน'], ['settings', 'ตั้งค่า'], ['media', 'สื่อสำหรับตู้ลิ้นชัก']];
  function openCount() { return A.list.filter(PP.isOpen).length; }
  function renderShell() {
    $('app').innerHTML = '<header class="atop wrapc"><div class="abrand"><img src="assets/emblem-gold.png" alt="ตราโรงเรียนพรตพิทยพยัต" width="34" height="42"><div><b>โรงเรียนพรตพิทยพยัต</b><span>งานทะเบียน · ระบบคำร้อง ปพ.1 / ปพ.6 / ปพ.7</span></div></div><div class="auser"><div><b>' + esc(A.me.displayName) + '</b><small>' + (A.me.role === 'admin' ? 'ผู้ดูแลระบบ' : 'เจ้าหน้าที่') + '</small></div><button class="btn btn-sm" data-act="logout">ออกจากระบบ</button></div></header><div class="stripe"></div>' +
      '<nav class="anav wrapc" id="nav" aria-label="เมนูหลังบ้าน"></nav><main class="abody wrapc" id="body"></main>';
    renderNav(); renderBody();
  }
  function renderNav() {
    var n = $('nav'); if (!n) return;
    n.innerHTML = TABS.map(function (t) { return '<button class="' + (A.view === t[0] ? 'on' : '') + '" data-act="view" data-v="' + t[0] + '">' + t[1] + (t[0] === 'queue' ? '<span class="cnt">' + openCount() + '</span>' : '') + '</button>'; }).join('') +
      '<span class="sync">' + (A.lastSync ? 'อัปเดต ' + PP.fT(A.lastSync) : '') + '</span>';
  }
  function renderBody() {
    var b = $('body'); if (!b) return;
    if (A.view === 'queue') {
      if (!$('q')) b.innerHTML = '<div class="tool"><label class="lbl" for="q" style="margin:0">ค้นหา</label><input class="inp" id="q" placeholder="เลขคำร้อง ชื่อ หรือรหัสนักเรียน" value="' + esc(A.q) + '" data-input="q"><button class="btn btn-sm btn-sec" data-act="reload">' + (A.busy ? '<span class="spin"></span>' : 'รีเฟรช') + '</button></div><div id="qlist" style="display:grid;gap:12px"></div>';
      $('qlist').innerHTML = queueHTML();
    } else if (A.view === 'manual') b.innerHTML = manualHTML();
    else if (A.view === 'report') b.innerHTML = reportHTML();
    else if (A.view === 'settings') b.innerHTML = settingsHTML();
    else if (A.view === 'media') b.innerHTML = mediaHTML();
  }

  /* ===================== Queue ===================== */

  function doPrint(html) {

    var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    var imgs = Array.prototype.slice.call(root.querySelectorAll('img')).map(function (im) {
      return im.complete ? Promise.resolve() : new Promise(function (res) { im.onload = im.onerror = res; setTimeout(res, 4000); });

    if (!R) { loadReport(); return '<div class="center"><span class="spin"></span><span>กำลังคำนวณรายงาน</span></div>'; }
    function tbl(head, rows) { return '<table class="mini"><thead><tr>' + head.map(function (h, i) { return '<th' + (i ? ' class="r"' : '') + '>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' + (rows.length ? rows.join('') : '<tr><td colspan="' + head.length + '" class="muted">ยังไม่มีข้อมูล</td></tr>') + '</tbody></table>'; }
    var st = Object.keys(R.byStatus).map(function (k) { return '<tr><td>' + ((PP.ST[k] || {}).label || k) + '</td><td class="r">' + R.byStatus[k] + '</td></tr>'; });
    var lvs = Object.keys(R.byLevel).sort().map(function (k) { var x = R.byLevel[k]; return '<tr><td>ม.' + k + '</td><td class="r">' + x.n + '</td><td class="r">' + x.pp1 + '</td><td class="r">' + (x.pp6 || 0) + '</td><td class="r">' + x.pp7 + '</td></tr>'; });
    var ms = Object.keys(R.byMonth).sort().map(function (k) { var p = k.split('-'); return '<tr><td>' + new Intl.DateTimeFormat('th-TH-u-ca-buddhist', { month: 'long', year: 'numeric' }).format(new Date(+p[0], +p[1] - 1, 1)) + '</td><td class="r">' + R.byMonth[k] + '</td></tr>'; });
    var fx = Object.keys(R.fixes).map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="r">' + R.fixes[k] + '</td></tr>'; });
    return '<div class="stats"><div><span>คำร้องทั้งหมด</span><b>' + R.total + '</b><small>ปพ.1 ' + R.pp1 + ' ชุด · ปพ.6 ' + (R.pp6 || 0) + ' แผ่น · ปพ.7 ' + R.pp7 + ' ชุด</small></div>' +
      '<div><span>เวลาเฉลี่ย เริ่มจัดทำถึงพร้อมรับ</span><b>' + (R.avgWorkdays === null ? '–' : R.avgWorkdays) + '</b><small>วันทำการ (' + R.timedCount + ' คำร้อง)</small></div>' +
      '<div><span>เสร็จภายใน ' + R.workMax + ' วันทำการ</span><b>' + (R.withinPct === null ? '–' : R.withinPct + '%') + '</b><small>ของคำร้องที่พร้อมรับแล้ว</small></div>' +
      '<div><span>ความพึงพอใจเฉลี่ย</span><b>' + (R.avgRating === null ? '–' : R.avgRating) + '</b><small>จาก 5 (' + R.ratingCount + ' คะแนน)</small></div></div>' +
      '<div class="grid2"><div>' + tbl(['สถานะ', 'คำร้อง'], st) + '</div><div>' + tbl(['ระดับชั้น', 'คำร้อง', 'ปพ.1', 'ปพ.6', 'ปพ.7'], lvs) + '</div><div>' + tbl(['เดือน', 'คำร้อง'], ms) + '</div><div>' + tbl(['เหตุผลที่ส่งกลับให้แก้ไข', 'ครั้ง'], fx) +
      '<p class="muted" style="font-size:13px;margin-top:8px">ช่องทาง: ออนไลน์ ' + R.channel.online + ' · ใบกระดาษ ' + R.channel.paper + ' · พิมพ์เอกสารใหม่ ' + R.reprint + ' ครั้ง</p></div></div>' +
      '<div><button class="btn btn-sm btn-sec" data-act="report-reload">คำนวณใหม่</button></div>';
  }
  function loadReport() { apiAdmin('adminReport').then(function (r) { A.report = r; if (A.view === 'report') renderBody(); }).catch(function (e) { PP.toast(e.message); }); }

  /* ===================== Settings ===================== */
  function settingsHTML() {
    var S = A.settings;
    function txt(k, label, hint) { return '<div><label class="lbl" for="s-' + k + '">' + label + '</label><input class="inp" id="s-' + k + '" data-set="' + k + '" value="' + esc(S[k]) + '">' + (hint ? '<p class="hint" style="font-size:12.5px;color:var(--ink-3)">' + hint + '</p>' : '') + '</div>'; }
    function sw(k, label) { var on = String(S[k]).toUpperCase() === 'TRUE'; return '<label class="sw"><input type="checkbox" data-set="' + k + '"' + (on ? ' checked' : '') + '><span>' + label + '</span></label>'; }
    return '<div class="panel"><h3>การรับคำร้อง</h3>' + sw('open', 'เปิดรับคำร้องออนไลน์') + sw('allowEnglish', 'ให้เลือกขอ ปพ.1 ฉบับภาษาอังกฤษ') +
      '<div><label class="lbl" for="s-announce">ข้อความประกาศหน้าแรกของนักเรียน (เว้นว่างได้)</label><textarea class="inp" id="s-announce" data-set="announce">' + esc(S.announce) + '</textarea></div></div>' +
      '<div class="panel"><h3>ปีการศึกษาและผลการเรียนใน SGS</h3><div class="grid3">' + txt('year', 'ปีการศึกษาปัจจุบัน', 'เปลี่ยนเมื่อขึ้นปีการศึกษาใหม่ พร้อมนำเข้ารายชื่อนักเรียนชั้นใหม่จาก SGS ใช้คำนวณภาคเรียนที่ขอ ปพ.6 ได้') + txt('latest', 'ภาคเรียนล่าสุดที่ผลการเรียนเข้า SGS แล้ว', 'รูปแบบ ภาค/ปี เช่น 2/2568 เมื่อเปลี่ยนแล้ว คำร้องที่รอผลการเรียนจะเดินต่อพร้อมกัน') + txt('pending', 'ภาคเรียนปัจจุบันที่ยังรอผลการเรียน', 'เช่น 1/2569 เว้นว่างถ้าไม่มี') + '</div></div>' +
      '<div class="panel"><h3>ระยะเวลา</h3><div class="grid3">' + txt('photoDays', 'วันให้ส่งรูปหลังยื่นคำร้อง') + txt('workMin', 'วันทำการขั้นต่ำที่คาดว่าเสร็จ') + txt('workMax', 'วันทำการสูงสุดที่คาดว่าเสร็จ') + txt('autoCloseDays', 'ปิดคำร้องเองเมื่อพร้อมรับเกิน (วัน)') + '</div>' +
      '<div><label class="lbl" for="s-holidays">วันหยุดที่ไม่นับเป็นวันทำการ (บรรทัดละ 1 วัน รูปแบบ ปปปป-ดด-วว ชื่อวันหยุด ใช้ปี ค.ศ.)</label><textarea class="inp num" id="s-holidays" data-set="holidays" style="min-height:180px">' + esc(S.holidays) + '</textarea></div></div>' +
      '<div class="panel"><h3>ชื่อในใบคำร้องที่พิมพ์</h3><div class="grid2">' + txt('staffName', 'เจ้าหน้าที่') + txt('registrarName', 'นายทะเบียน') + txt('approverName', 'ผู้ลงนามเห็นควร') + txt('approverTitle', 'ตำแหน่งผู้ลงนามเห็นควร') + '</div></div>' +
      (A.setErr ? '<div class="note n-alert" style="max-width:820px"><span>' + esc(A.setErr) + '</span></div>' : '') +
      '<div class="acts"><button class="btn btn-pri" data-act="save-settings"' + (A.busy ? ' disabled' : '') + '>' + (A.busy ? '<span class="spin"></span> กำลังบันทึก' : 'บันทึกการตั้งค่า') + '</button></div>' +
      '<p class="muted" style="font-size:13px">นักเรียนในฐานข้อมูล ' + A.students.toLocaleString('th-TH') + ' คน · เลขคำร้องถัดไป ' + esc(S.nextNo) + '/' + esc(S.year) + ' · ผู้ใช้หลังบ้านและรหัสผ่านชั่วคราว จัดการในชีต "ผู้ใช้หลังบ้าน" ของฐานข้อมูล</p>';
  }

  /* ===================== Media ===================== */
  function mediaHTML() {
    var url = A.settings.studentUrl || '', qr = qrSvg(url, 6);
    return '<div class="panel"><h3>ลิงก์และ QR หน้าเว็บนักเรียน</h3><div class="qrbox"><div class="qr">' + (qr || '<span class="muted">โหลดตัวสร้าง QR ไม่ได้</span>') + '</div><div style="display:grid;gap:8px;min-width:0;flex:1"><div class="urlbox">' + esc(url) + '</div><div class="acts"><button class="btn btn-sm btn-sec" data-act="copy" data-v="' + esc(url) + '">คัดลอกลิงก์</button><a class="btn btn-sm btn-sec" href="' + esc(url) + '" target="_blank" rel="noopener">เปิดหน้าเว็บนักเรียน</a></div></div></div></div>' +
      '<div class="panel"><h3>พิมพ์สื่อสำหรับตู้ลิ้นชัก</h3><p class="hint">ใบนำส่งรูปถ่ายวางในลิ้นชักที่ 1 พิมพ์เป็นต้นฉบับขาวดำ A4 แนวนอน 1 แผ่นได้ 2 ใบ ถ่ายเอกสารแล้วตัดครึ่งตามเส้นประ ส่วนโปสเตอร์ QR ติดที่ตู้ลิ้นชัก</p><div class="acts"><button class="btn btn-pri" data-act="print-slips">พิมพ์ใบนำส่งรูปถ่าย</button><button class="btn btn-sec" data-act="print-poster">พิมพ์โปสเตอร์ QR (A4)</button></div></div>';
  }

  /* ===================== Events ===================== */
  var ACT = {};
  ACT.reload = function () { if (!$('body')) return load(true); A.busy = true; renderBody(); load(false).then(function () { A.busy = false; renderBody(); }); };
  ACT.logout = function () { var t = A.token; PP.store.del(TOKEN_KEY); A.token = null; A.open = null; renderLogin(); if (t) PP.api('adminLogout', { token: t }).catch(function () { }); };
  ACT.view = function (a) { A.view = a.dataset.v; A.open = null; if (A.view === 'report') A.report = null; A.setErr = ''; renderDrawer(); renderNav(); renderBody(); };
  ACT.filter = function (a) { A.filter = a.dataset.v; renderBody(); };
  ACT.open = function (a) { A.open = a.dataset.no; A.fixOpen = false; A.fixText = ''; A.fixIdx = 0; A.confirm = null; renderDrawer(); renderBody(); try { history.replaceState(null, '', '#no=' + A.open); } catch (e) { } };
  ACT.close = function () { A.open = null; renderDrawer(); renderBody(); try { history.replaceState(null, '', location.pathname); } catch (e) { } };
  ACT.clear = function () { A.sel = {}; renderBody(); };
  ACT.copy = function (a) {
    var v = a.dataset.v, orig = a.textContent;
    function done() { a.textContent = 'คัดลอกแล้ว'; setTimeout(function () { a.textContent = orig; }, 1300); }
    function fb() { var t = document.createElement('textarea'); t.value = v; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { PP.toast(v); } t.remove(); }
    try { if (navigator.clipboard) navigator.clipboard.writeText(v).then(done, fb); else fb(); } catch (e) { fb(); }
  };
  function runAct(nos, act) {
    if (A.busy) return;
    A.busy = true;
    var label = { recv: 'ได้รับรูปแล้ว', sign: 'เสนอลงนาม', ready: 'พร้อมรับ', staffdone: 'รับเอกสารแล้ว', resume: 'ดำเนินการต่อ', cancel: 'ยกเลิกคำร้อง', reopen: 'เปิดคำร้องอีกครั้ง', reprint: 'บันทึกการพิมพ์ใหม่' }[act];
    apiAdmin('adminAct', { nos: nos, act: act }).then(function (r) {
      A.busy = false; A.confirm = null; A.keepScroll = true;
      PP.toast('"' + label + '" ' + r.done.length + ' รายการ' + (r.skipped.length ? ' · ข้าม ' + r.skipped.length + ' รายการที่อยู่ขั้นอื่น' : ''));
      return load(false);
    }).catch(function (e) { A.busy = false; if (e.code !== 'AUTH') PP.toast(e.message); });
  }
  ACT.batch = function (a) { var nos = selList(); A.sel = {}; runAct(nos, a.dataset.v); };
  ACT.act = function (a) { runAct([A.open], a.dataset.v); };
  ACT.confirm = function (a) { A.confirm = a.dataset.v || null; A.keepScroll = true; renderDrawer(); };
  ACT['fix-open'] = function () { A.fixOpen = true; A.fixIdx = 0; A.fixText = ''; A.keepScroll = true; renderDrawer(); };
  ACT['fix-close'] = function () { A.fixOpen = false; A.keepScroll = true; renderDrawer(); };
  ACT['fix-send'] = function () {
    var fx = A.fixReasons[A.fixIdx] || {};
    if (!fx.todo && !A.fixText.trim()) return PP.toast('เหตุผล "อื่น ๆ" ต้องพิมพ์ข้อความถึงนักเรียน');
    if (A.busy) return; A.busy = true;
    apiAdmin('adminFix', { no: A.open, reason: A.fixIdx, text: A.fixText }).then(function () { A.busy = false; A.fixOpen = false; PP.toast('ส่งคำร้อง ' + A.open + ' กลับให้นักเรียนแก้ไขแล้ว'); return load(false); })
      .catch(function (e) { A.busy = false; if (e.code !== 'AUTH') PP.toast(e.message); });
  };
  ACT['save-note'] = function () {
    var v = $('note').value, no = A.open;
    apiAdmin('adminNote', { no: no, note: v }).then(function () { var r = find(no); if (r) r.note = v; PP.toast('บันทึกแล้ว'); }).catch(function (e) { if (e.code !== 'AUTH') PP.toast(e.message); });
  };
  ACT['print-forms'] = function (a) { var list = a.dataset.v === 'one' ? [find(A.open)] : selList().map(find); list = list.filter(Boolean); if (!list.length) return; printForms2(list); };
  ACT['print-labels'] = function (a) { var list = a.dataset.v === 'one' ? [find(A.open)] : selList().map(find); list = list.filter(Boolean); if (!list.length) return; printLabels(list); };
  ACT['print-signlist'] = function () { var list = selList().map(find).filter(Boolean); if (!list.length) return; doPrint('<div class="pg-port">' + signListHTML(list) + '</div>'); };
  ACT['print-slips'] = function () { var u = A.settings.studentUrl || ''; doPrint('<div class="pg-land slips">' + slipHTML(u) + slipHTML(u) + '</div>'); };
  ACT['print-poster'] = function () { doPrint('<div class="pg-port">' + posterHTML() + '</div>'); };
  ACT['report-reload'] = function () { A.report = null; renderBody(); };
  ACT['man-reset'] = function () { manReset(); renderBody(); };
  ACT['man-find'] = function () {
    var sid = (A.man.sid || '').replace(/\D/g, '');
    if (!/^\d{5}$/.test(sid)) return PP.toast('รหัสนักเรียนต้องเป็นตัวเลข 5 หลัก');
    apiAdmin('adminFindStudent', { sid: sid }).then(function (r) {
      A.man.looked = true; A.man.student = r.student; A.man.openNos = r.open || []; A.man.err = ''; A.man.pp6Sems = [];
      var opts = PP.scopeOpts(A.cfg, r.student ? r.student.level : A.man.m.level); A.man.scope = opts[0].v;
      renderBody();
    }).catch(function (e) { if (e.code !== 'AUTH') PP.toast(e.message); });
  };
  ACT['man-save'] = function () {
    var M = A.man; if (A.busy) return;
    var req = { pp1: +M.pp1, scope: M.scope, lang: M.lang, pp7: +M.pp7, pp6Sems: M.pp6Sems.slice(), purpose: M.purpose, other: M.other, needBy: M.needBy, phone: String(M.phone).replace(/\D/g, '') };
    A.busy = true; M.err = ''; renderBody();
    apiAdmin('adminCreate', { sid: M.sid.replace(/\D/g, ''), req: req, manual: M.student ? null : M.m }).then(function (r) {
      A.busy = false; PP.toast('บันทึกคำร้อง ' + r.request.no + ' แล้ว'); manReset(); A.view = 'queue'; A.open = r.request.no; renderNav();
      return load(false).then(function () { renderBody(); renderDrawer(); });
    }).catch(function (e) { A.busy = false; M.err = e.message; renderBody(); });
  };
  ACT['save-settings'] = function () {
    var patch = {};
    document.querySelectorAll('[data-set]').forEach(function (el) { var k = el.dataset.set; patch[k] = el.type === 'checkbox' ? (el.checked ? 'TRUE' : 'FALSE') : el.value; });
    if (A.busy) return; A.busy = true; A.setErr = ''; renderBody();
    apiAdmin('adminSaveSettings', { patch: patch }).then(function (r) {
      A.busy = false; A.settings = r.settings; A.cfg = r.config; PP.cfg = r.config; PP.setHolidays(r.config.holidays);
      PP.toast(r.changed.length ? 'บันทึกการตั้งค่าแล้ว' + (r.released ? ' · ปลดล็อกคำร้องที่รอผลการเรียน ' + r.released + ' รายการ' : '') : 'ไม่มีค่าที่เปลี่ยน');
      renderBody(); if (r.released) load(false);
    }).catch(function (e) { A.busy = false; A.setErr = e.message; renderBody(); });
  };

  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'open' && e.target.closest('input,button,label,select,textarea,a')) return;
    var fn = ACT[a.dataset.act]; if (fn) { if (a.tagName !== 'A') e.preventDefault(); fn(a, e); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, k = t.dataset && t.dataset.change;
    if (k === 'sel') { A.sel[t.dataset.no] = t.checked; renderBody(); }
    if (k === 'man6') { var L6 = A.man.pp6Sems, i6 = L6.indexOf(t.value); if (t.checked && i6 < 0) L6.push(t.value); if (!t.checked && i6 > -1) L6.splice(i6, 1); L6.sort(function (x, y) { return PP.semKey(x) - PP.semKey(y); }); }
    else if (k === 'all') { A.list.filter(function (r) { return match(r, A.filter) && searchOk(r); }).forEach(function (r) { A.sel[r.no] = t.checked; }); renderBody(); }
    else if (k === 'fix-r') { A.fixIdx = Number(t.value); A.keepScroll = true; renderDrawer(); }
    if (t.dataset && t.dataset.man && t.tagName === 'SELECT') {
      setMan(t);
      if (t.dataset.man === 'm.level') {
        // ภาคเรียน ปพ.6 ที่เลือกไว้ต้องอยู่ในช่วงชั้นใหม่ด้วย
        var ok6 = [].concat.apply([], PP.pp6Opts(A.cfg, A.man.m.level).map(function (g) { return g.sems; }));
        A.man.pp6Sems = A.man.pp6Sems.filter(function (v) { return ok6.indexOf(v) > -1; });
        renderBody();
      }
    }
  });
  function setMan(t) { var p = t.dataset.man.split('.'); if (p.length === 2) A.man[p[0]][p[1]] = t.value; else A.man[p[0]] = t.value; }
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t.dataset) return;
    if (t.dataset.input === 'q') { A.q = t.value; $('qlist').innerHTML = queueHTML(); }
    if (t.dataset.input === 'fix-t') A.fixText = t.value;
    if (t.dataset.man && t.tagName !== 'SELECT') setMan(t);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && A.open && !A.fixOpen) ACT.close(); });
  setInterval(function () {
    if (!A.token || document.visibilityState !== 'visible' || A.busy || A.view !== 'queue') return;
    var ae = document.activeElement; if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.id !== 'q') return;
    if (A.fixOpen || A.confirm) return;
    A.keepScroll = true; load(false);
  }, 60000);

  /* ===================== Boot ===================== */
  A.token = PP.store.get(TOKEN_KEY);
  if (A.token) load(true); else renderLogin();
})();
</script>
</body>
</html>
